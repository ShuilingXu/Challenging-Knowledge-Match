# Reused upstream connections. Without keepalive every /api request opened a fresh TCP
# connection to the API, which under a burst of 50 participants meant hundreds of connects
# per second against a 4-vCPU box.
upstream knowledge_match_api {
    server 127.0.0.1:8082;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name match.soyorin.love;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/match.soyorin.love/index;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name match.soyorin.love;

    access_log /www/sites/match.soyorin.love/log/access.log main;
    error_log /www/sites/match.soyorin.love/log/error.log;
    ssl_certificate /www/sites/match.soyorin.love/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/match.soyorin.love/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 24m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /www/sites/match.soyorin.love/index;
    index index.html;

    # gzip is enabled globally, but its gzip_types list omits application/json, so every API
    # payload (scoreboard, question list, control state) was sent uncompressed. Widening the
    # list here affects only this server block. gzip_proxied any is required because anonymous
    # requests carry no Authorization header, which the global setting keys off.
    gzip_types text/plain text/css application/javascript application/json application/xml
               image/svg+xml text/xml;
    gzip_proxied any;
    gzip_comp_level 4;

    location /api/ {
        proxy_pass http://knowledge_match_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The API uses path-style S3 URLs such as
    # /matrixlive-media/<object-key>. Keep the original host and request path
    # intact so MinIO can validate the AWS v4 signature after TLS termination.
    location ^~ /matrixlive-media {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Vite emits content-hashed filenames under /assets, so they never change in place.
    # expires is used instead of add_header so the server-level HSTS header stays inherited.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
    }

    # index.html references those hashes and must always revalidate so a deploy takes effect.
    location = /index.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
