map $http_x_real_ip $client_ip {
  "" $remote_addr;
  default $http_x_real_ip;
}

# Reuse connections to the API instead of opening one per request.
upstream knowledge_match_api {
    server api:8080;
    keepalive 64;
}

# The built bundle is ~513 KB of JS; gzip takes it to ~151 KB (3.4x).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/xml
           image/svg+xml text/xml;

server {
  client_max_body_size 24m;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://knowledge_match_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header Forwarded "";
  }

  location /ws {
    proxy_pass http://knowledge_match_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Content-hashed build output is safe to cache for a year.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
