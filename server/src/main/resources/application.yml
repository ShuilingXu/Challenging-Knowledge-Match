spring:
  application:
    name: knowledge-match-api
  datasource:
    url: jdbc:h2:mem:knowledge-match;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  data:
    redis:
      repositories:
        enabled: false
server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

app:
  realtime:
    redis-enabled: ${REALTIME_REDIS_ENABLED:false}
    channel: ${REALTIME_REDIS_CHANNEL:matrixlive.events}
  storage:
    enabled: ${S3_ENABLED:false}
    # Leave endpoint empty for AWS S3; ObjectStorageService derives the
    # regional endpoint. Set S3_ENDPOINT for MinIO or another S3-compatible
    # provider.
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:${AWS_REGION:us-east-1}}
    access-key: ${S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
    secret-key: ${S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
    session-token: ${S3_SESSION_TOKEN:${AWS_SESSION_TOKEN:}}
    bucket: ${S3_BUCKET:${AWS_S3_BUCKET:}}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    addressing-style: ${S3_ADDRESSING_STYLE:AUTO}
    max-file-size: ${S3_MAX_FILE_SIZE:20971520}

  security:
    jwt:
      # Development-only fallback. Production must set JWT_SECRET to a unique 256-bit base64 value.
      secret: ${JWT_SECRET:QWxsZGV2ZWxvcG1lbnQtc2VjcmV0cy1tdXN0LWJlLXJlcGxhY2VkLTIwMjY=}
      issuer: ${JWT_ISSUER:matrixlive-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      participant-token-ttl: ${JWT_PARTICIPANT_TOKEN_TTL:PT2H}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:PT720H}
      refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
